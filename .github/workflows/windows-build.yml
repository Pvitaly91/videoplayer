name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VideoPlayer.sln

      - name: Build
        run: dotnet build VideoPlayer.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/VideoPlayer.Tests/VideoPlayer.Tests.csproj -c Release --no-build --no-restore -p:Platform=x64

      - name: Publish portable win-x64 build
        run: >-
          dotnet publish src/VideoPlayer/VideoPlayer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -o artifacts/win-x64

      - name: Verify portable output
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $PWD 'artifacts\win-x64'
          $requiredFiles = @(
            'VideoPlayer.exe',
            'LibVLCSharp.dll',
            'LibVLCSharp.WPF.dll',
            'THIRD_PARTY_NOTICES.md',
            'hostfxr.dll',
            'hostpolicy.dll',
            'coreclr.dll'
          )

          foreach ($fileName in $requiredFiles) {
            $path = Join-Path $publishDirectory $fileName
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing required portable file: $path"
            }
          }

          $libVlcDirectory = Join-Path $publishDirectory 'libvlc\win-x64'
          foreach ($fileName in @('libvlc.dll', 'libvlccore.dll')) {
            $path = Join-Path $libVlcDirectory $fileName
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing required x64 LibVLC file: $path"
            }
          }

          $unexpectedNativeRoots = @(Get-ChildItem -LiteralPath (Join-Path $publishDirectory 'libvlc') -Directory |
            Where-Object { $_.Name -ne 'win-x64' })
          if ($unexpectedNativeRoots.Count -gt 0) {
            throw "Unexpected LibVLC architecture: $($unexpectedNativeRoots.Name -join ', ')"
          }

          $pluginsDirectory = Join-Path $libVlcDirectory 'plugins'
          $plugin = Get-ChildItem -LiteralPath $pluginsDirectory -Filter '*.dll' -File -Recurse |
            Select-Object -First 1
          if ($null -eq $plugin) {
            throw "Missing LibVLC plugins: $pluginsDirectory"
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
          retention-days: 14
